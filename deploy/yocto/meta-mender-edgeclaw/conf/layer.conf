# Layer configuration for meta-mender-edgeclaw
# Mender OTA integration for EdgeClaw IoT fleet devices

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mender-edgeclaw"
BBFILE_PATTERN_meta-mender-edgeclaw = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-edgeclaw = "10"

LAYERDEPENDS_meta-mender-edgeclaw = "core meta-mender-core"
LAYERSERIES_COMPAT_meta-mender-edgeclaw = "kirkstone scarthgap"
