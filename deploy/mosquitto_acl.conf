# EdgeClaw MQTT ACL Configuration
# ================================
# Controls which users can publish/subscribe to which topics.
# Uses Mosquitto pattern substitution: %c = client ID.

# -------------------------------------------------------------------
# Admin user — full read/write access to the entire edgeclaw topic tree
# -------------------------------------------------------------------
user admin
topic readwrite edgeclaw/#

# -------------------------------------------------------------------
# Edge-bot pattern rules
# Each edge bot connects with client ID "edge-bot-<node-id>".
# The pattern keyword applies to any user whose client ID matches.
# -------------------------------------------------------------------

# Share alerts with the fleet
pattern write edgeclaw/fleet/alerts

# Share analysis / insights with the fleet
pattern write edgeclaw/fleet/insights

# Receive fleet-wide alerts
pattern read edgeclaw/fleet/alerts

# Receive fleet-wide insights
pattern read edgeclaw/fleet/insights

# Receive commands addressed to this specific bot (%c = own client ID)
pattern read edgeclaw/fleet/commands/%c

# Report own status (%c = own client ID)
pattern write edgeclaw/fleet/status/%c
